name: Catalog QA — запрос на пилот
description: Вопрос о программе или запрос на проверку собственных товарных данных
title: "[Catalog QA] "
labels: ["order"]
body:
  - type: markdown
    attributes:
      value: |
        Это запрос на обсуждение, а не покупка. Не прикладывайте персональные данные, секреты и реальные конфиденциальные каталоги.
  - type: dropdown
    id: intent
    attributes:
      label: Что вас интересует
      options:
        - Тестирование локального приложения
        - Платная сверка Excel/CSV по моим правилам
        - Настройка формата отчёта
        - Вопрос о возможностях
    validations:
      required: true
  - type: textarea
    id: sample_structure
    attributes:
      label: Как устроены ваши данные
      description: Достаточно обезличенного перечня столбцов и ожидаемого результата.
      placeholder: Например, два CSV с колонками SKU, бренд, артикул, количество; нужно выявить конфликты.
    validations:
      required: true
  - type: input
    id: volume
    attributes:
      label: Примерный объём
      placeholder: Например, 200 пар
  - type: checkboxes
    id: privacy
    attributes:
      label: Безопасность данных
      options:
        - label: Я не публикую в этой заявке пароли, токены и конфиденциальные данные
          required: true
