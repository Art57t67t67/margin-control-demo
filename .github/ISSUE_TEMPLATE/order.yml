name: Заказать Margin Control / автоматизацию Excel
description: Оставьте задачу — ответим по объёму, сроку и стоимости
title: "[Заказ] "
labels: ["order"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите задачу без конфиденциальных данных. Не прикладывайте пароли, токены, банковские реквизиты и внутренние секреты.
  - type: dropdown
    id: service
    attributes:
      label: Что нужно
      options:
        - Настроить Margin Control под мой CSV
        - Автоматизировать Excel/CSV-процесс
        - Сверка/очистка/объединение таблиц
        - Другое
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Что сейчас делаете вручную
      description: Кратко опишите исходные данные и желаемый результат.
    validations:
      required: true
  - type: input
    id: rows
    attributes:
      label: Примерный объём данных
      placeholder: например, 5 файлов по 20 000 строк
  - type: dropdown
    id: budget
    attributes:
      label: Ориентир бюджета
      options:
        - до 10 000 ₽
        - 10 000–20 000 ₽
        - 20 000–30 000 ₽
        - выше 30 000 ₽
        - сначала хочу оценку
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Пример структуры данных
      description: Можно описать столбцы словами. Не публикуйте чувствительные данные.
